<html>
    <head>
        <meta charset="UTF-8">
        <title>Simple Free HLS Player Example</title>
        <!-- Include hls.js from a CDN -->
        <script src="https://cdn.tutorialjinni.com/hls.js/1.2.1/hls.min.js"></script>

    </head>
    <body>
        <!-- HTML5 Video Tag -->
        <div class="video">

        </div>
        <!-- Invocation Script -->
        <script type="module">
            const res = await fetch('http://localhost:3003/stream')
            const steamData = await res.json()

            if (Hls.isSupported()) {
              const video = document.createElement('video');
              const videoContainer = document.querySelector('.video');

              video.controls = true;
              video.autoplay = true;
              video.muted = true;
              video.style.width = '100%';

              const hls = new Hls();
              hls.loadSource(steamData.path);

              console.log(steamData);
              // video.duration = steamData,infos.format.duration;

              hls.attachMedia(video);

              video.currentTime = 0;

              videoContainer.appendChild(video);
            }else{
                alert("Cannot stream HLS, use another video source");
            }
        </script>
    </body>
</html>
