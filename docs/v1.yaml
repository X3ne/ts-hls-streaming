openapi: 3.0.2
info:
  title: Api
  version: 1.0.0
  contact: {}
paths:
  /logs:
    get:
      operationId: getLogs
      summary: Retrieve latest server logs
      tags:
        - utils
      security:
        - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Log'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorModel'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorModel'
      parameters: []
  /stream:
    get:
      operationId: getStream
      summary: Start a new stream
      tags:
        - stream
      security:
        - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorModel'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorModel'
      parameters: []
components:
  schemas:
    ApiErrorModel:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    SuccessModel:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    MessageModel:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    StreamModel:
      type: object
      properties:
        path:
          type: string
      required:
        - path
    Log:
      type: object
      description: Server log entry
      properties:
        message:
          description: Log message
          type: string
        time:
          description: Log timestamp in seconds
          type: number
        level:
          type: string
          enum:
            - debug
            - info
            - warn
            - error
      required:
        - message
        - time
        - level
  responses:
    '204':
      description: Successful operation
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorModel'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorModel'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorModel'
    '404':
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorModel'
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorModel'
    '503':
      description: Server is busy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorModel'
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  links: {}
  callbacks: {}
security: []
